# Local SMTP sink for step 2: nothing sent here leaves the machine.
#   docker compose up -d     ->  SMTP on 127.0.0.1:1025, web UI on http://127.0.0.1:8025
services:
  mailpit:
    image: axllent/mailpit:v1.33.0
    container_name: alerting-mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
