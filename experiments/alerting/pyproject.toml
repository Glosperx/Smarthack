# Standalone uv project: its own venv (.venv here) and its own uv.lock.
# It is NOT a member of the root workspace, and the root pyproject.toml must not
# mention it: run every uv command from this directory.
[project]
name = "smarthack-alerting"
version = "0.1.0"
description = "Executes an alert decision: always an email, plus a phone call to on-call when the decision says so."
requires-python = ">=3.13,<3.14"
dependencies = [
    "jinja2==3.1.6",
    "pydantic==2.14.3",
    "python-dotenv==1.2.4",
    "requests==2.34.2",
    "twilio==9.13.0",
]

[dependency-groups]
dev = [
    "black==26.10.1",
    "flake8==7.5.0",
    "isort==9.0.2",
    "mypy==2.4.1",
    "pytest==9.2.0",
]
tts = [
    "piper-tts==1.8.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "alerting"
module-root = ""

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.isort]
profile = "black"
force_sort_within_sections = true
line_length = 100
known_first_party = ["alerting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["mailpit: talks to the local Mailpit container; skipped when it is not running"]

[tool.mypy]
files = ["alerting", "tests"]
disallow_untyped_defs = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

# piper-tts and twilio ship no type information.
[[tool.mypy.overrides]]
module = ["piper", "piper.*", "twilio", "twilio.*"]
ignore_missing_imports = true

[tool.uv]
# `uv run` keeps the Piper preview installed too.
default-groups = ["dev", "tts"]
